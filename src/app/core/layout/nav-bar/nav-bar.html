<div class="lg:flex gap-5 justify-between items-center mb-5">
  <div class="lg:w-2/3 mb-5 lg:mb-0">
    <app-input-search [placeholder]="'Search'" [icon]="'pi pi-search'" />
  </div>
  <div class="lg:w-1/3 flex mb-5 lg:mb-0 justify-end items-center gap-3">
    <app-main-icon [icon]="'pi pi-shopping-bag'" />
    <app-main-icon [icon]="'pi pi-bell'" />
    <div class="flex justify-between items-center gap-2">
      <p-avatar
        image="Icons/icon-face.png"
        class="flex items-center justify-center mr-2"
        size="normal"
      />
      <p class="text-sm font-semibold me-4">Johny Larsen</p>

      <!-- <div id="user-menu" class="w-fit">
        <p-menu #menu [model]="items" [popup]="true" [appendTo]="'body'">
          <ng-template #item let-item let-root="root">
            <a (click)="logout()">{{ item.label }}</a>
          </ng-template>
        </p-menu>
        <p-button (click)="menu.toggle($event)" icon="pi pi-ellipsis-v" />
      </div> -->
    </div>
    @if (isLoggedIn()) {
      <a
        (click)="logout()"
        class="text-red-400 cursor-pointer underline font-semibold hover:duration-75"
        >Logout</a
      >
    } @else {
      <a
        [routerLink]="['/login']"
        class="text-blue-400 cursor-pointer underline font-semibold hover:duration-75"
        >Login</a
      >
    }
  </div>
</div>
