<div class="flex justify-center gap-5 items-center py-10 bg-white rounded-2xl">
  <img [src]="img()" alt="" />
  <div>
    <p class="text-gray-400 text-sm">{{ title() }}</p>
    <div class="flex gap-5 justify-between items-center">
      <h2 class="text-xl font-bold">{{coast()}}</h2>
      @if (discount()) {
        <div [class]="style()" class="text-sm px-1  rounded-lg">
          <p class="">{{discount()}}</p>
        </div>
      }
    </div>
  </div>
</div>
