<div class="h-full">
  <div class="flex px-3 justify-between items-center">
    <h1 class="text-lg font-bold mb-5">Reports</h1>
    <ul class="flex justify-end items-center font-bold">
      <li class="me-5">Day</li>
      <li class="me-5 text-blue-600">Week</li>
      <li class="me-5">Month</li>
      <li class="me-5">Year</li>
    </ul>
  </div>
  <ngx-charts-line-chart
    [results]="data"
    [xAxis]="true"
    [yAxis]="true"
    [legend]="true"
    [scheme]="colorScheme"
    [referenceLines]="referenceLines"
    [showRefLines]="true"
    [showRefLabels]="true"
  >
  </ngx-charts-line-chart>
</div>
