<div class="h-full">
  <div class="flex px-3 lg:text-lg text-sm justify-between items-center mb-5">
    <h1 class="lg:text-lg font-bold ">Reports</h1>
    <ul class="flex justify-end items-center font-bold">
      <li class="me-5 cursor-pointer">Day</li>
      <li class="me-5 text-blue-600 cursor-pointer">Week</li>
      <li class="me-5 cursor-pointer">Month</li>
      <li class="me-5 cursor-pointer">Year</li>
    </ul>
  </div>
  <ngx-charts-line-chart
    [results]="data"
    [xAxis]="true"
    [yAxis]="true"
    [legend]="true"
    [scheme]="colorScheme"
    [referenceLines]="referenceLines"
    [showRefLines]="true"
    [showRefLabels]="true"
  >
  </ngx-charts-line-chart>
</div>
