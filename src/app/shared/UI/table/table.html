<div>
  <div class="flex justify-between items-center mb-5 px-1">
    <p class="font-bold text-lg">Recent orders</p>
    <div class="flex justify-between items-center text-gray-400 gap-1">
      <a class="text-gray-400 hover:underline hover:font-bold duration-75 cursor-pointer">
        Go to Orders Page
      </a>
      <div class="pi pi-arrow-right"></div>
    </div>
  </div>
  <p-table [value]="orders || []" [tableStyle]="{ 'min-width': '60rem' }">
    <ng-template #header>
      <tr>
        <th>Item Name</th>
        <th>Qty</th>
        <th>Order Date</th>
        <th>Amount</th>
        <th>Category</th>
        <th>Status</th>
      </tr>
    </ng-template>
    <ng-template #body let-order>
      <tr>
        <td class="flex justify-start items-center gap-2">
          <div class="w-10 h-10 overflow-hidden flex justify-center items-center rounded-full">
            <img [src]="order.image" width="5rem" [alt]="order.title" class="w-20 rounded-2xl" />
          </div>
          <p>{{ order.title }}</p>
        </td>
        <td>1</td>
        <td>January 20, 2022</td>

        <td>{{ order.price | currency: 'USD' }}</td>
        <td>{{ order.category }}</td>
        <!-- <td><p-rating [(ngModel)]="order.rating" [readonly]="true" [cancel]="false" /></td> -->
        <td>
          <p-tag [value]="'Pending'" [severity]="getSeverity('Pending')" />
        </td>
      </tr>
    </ng-template>
    <ng-template #footer>
      <tr>
        <td colspan="6">In total there are {{ allOrders() ? allOrders()?.length : 0 }} Orders.</td>
      </tr>
    </ng-template>
  </p-table>
</div>
